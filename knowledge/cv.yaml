    text: >
      En 2023 Jordi fue colaborador técnico en el sistema institucional de
      puntos de la UNAM. Corrigió incidencias y mejoró componentes de UI para
      aumentar la precisión y prevenir errores de captura. El CV no describe
      otro empleo anterior a Rocketel.

