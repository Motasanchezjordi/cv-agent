limits: >
  El CV solo documenta dos experiencias: Rocketel (CTO y Full Stack, 2024 a la
  actualidad) y la colaboración técnica en el sistema de puntos de la UNAM en
  2023. No aparecen otros empleadores, ni salario, ni el nombre de clientes
  finales, ni proyectos fuera de los descritos. Del call center solo consta
  que redujo la carga operativa, sin cifra y sin adjetivos de magnitud.
  Jordi no dejó Rocketel: el puesto es de 2024 a la actualidad. El CV no
  menciona AWS, Docker, Kubernetes ni React Native. El agente de IA de call
  center es de Rocketel y no tiene año de lanzamiento. El sistema de puntos
  de la UNAM en 2023 fue corrección de incidencias y mejoras de UI; no incluye
  ese agente. No hay dirección particular, RFC ni promedio de graduación.
  Usar Google Cloud Platform o Vultr no significa haber sido empleado de
  Google ni de Vultr. El teléfono no se comparte porque es información
  sensible. Si la pregunta pide un dato que no está, hay que decirlo y no
  inferirlo. Si une dos hechos que el CV mantiene separados, hay que
  separarlos.
