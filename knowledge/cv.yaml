    text: >
      Jordi Adrián Mota Sánchez es Ingeniero en Computación por la UNAM y
      Full Stack Developer con experiencia liderando productos de punta a punta,
      desde el diseño de arquitectura hasta el despliegue en producción.
      Está especializado en React, Node.js, FastAPI y PostgreSQL, y tiene un
      Diplomado en Ciberseguridad de la UNAM. Ha escalado sistemas críticos
      para empresas de telecomunicaciones: CRMs, portales de clientes,
      control de inventarios y agentes de IA en producción. Vive en CDMX.

  - id: rocketel
    title: Rocketel, CTO y Full Stack Developer (2024-actualidad)
    keywords:
      - rocketel
      - cto
      - actualidad
      - sim
      - sucursales
      - crm
      - portal
      - call center
      - inventario
      - rag
      - vultr
      - nginx
      - produccion
      - telecomunicaciones
      - agente
      - experiencia
      - proyecto
      - proyectos
      - ia
      - inteligencia
      - api
      - despliegue
      - porcentaje
      - seguridad
      - servidores
    text: >
      Desde 2024 Jordi es CTO y Full Stack Developer en Rocketel.
      Lideró el diseño, la construcción y el lanzamiento de un ecosistema
      para venta de SIMs en tiendas, que creció de 15 a más de 30 sucursales
      activas. Diseñó y desarrolló de punta a punta un CRM y portal de clientes
      (React en frontend, Node.js y FastAPI en backend, PostgreSQL) con estados
      de gastos, gráficas de indicadores, grabaciones de llamadas y reportes
      descargables, llevado a producción. Desarrolló e implementó en producción
      un agente de IA para atención a clientes en call center, que redujo la
      carga operativa del equipo de soporte; el CV no da un porcentaje ni un
      número de esa reducción. Dirigió una plataforma de IA para la operación
      de telecomunicaciones, con alertas automáticas, levantamiento de tickets,
      monitoreo en tiempo real, ejecución de configuraciones, escalamiento de
      incidencias y un agente RAG de consulta interna para el equipo técnico.
      Diseñó el sistema de inventario de SIMs con trazabilidad en tiempo real.
      Administra servidores en Vultr y Google Cloud Platform con Nginx, y
      despliega sitios con formularios, pasarelas de pago y alta disponibilidad.
      Aplica principios de ciberseguridad en la arquitectura, el manejo de
      credenciales y la configuración de servidores.

  - id: unam-puntos
    title: Colaboración técnica en la UNAM (2023)
    keywords:
